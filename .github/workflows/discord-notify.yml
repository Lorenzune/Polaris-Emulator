name: Discord Notifications

on:
  push:
    branches: [main, dev]
  pull_request_target:
    branches: [main, dev]
    types: [opened, reopened, synchronize, closed, ready_for_review]
  workflow_dispatch:
    inputs:
      branch:
        description: Notification channel to test
        type: choice
        options: [main, dev]
        default: main
        required: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  notify:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Never check out or execute PR code: this job only reads event metadata.
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_MAIN: ${{ secrets.DISCORD_WEBHOOK_MAIN }}
          DISCORD_WEBHOOK_DEV: ${{ secrets.DISCORD_WEBHOOK_DEV }}
          NOTIFICATION_BRANCH: ${{ inputs.branch }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const env = process.env;
          const event = JSON.parse(readFileSync(env.GITHUB_EVENT_PATH, 'utf8'));
          const branch = env.GITHUB_EVENT_NAME === 'pull_request_target'
            ? event.pull_request.base.ref
            : env.GITHUB_EVENT_NAME === 'workflow_dispatch'
              ? env.NOTIFICATION_BRANCH
              : event.ref.replace(/^refs\/heads\//, '');
          if (!['main', 'dev'].includes(branch)) throw new Error('Unsupported notification branch');
          const webhook = branch === 'main' ? env.DISCORD_WEBHOOK_MAIN : env.DISCORD_WEBHOOK_DEV;
          if (!webhook) throw new Error('Missing Discord webhook secret for ' + branch);

          const repo = event.repository.full_name;
          const actor = env.GITHUB_ACTOR;
          const short = (value, limit) => String(value || '').slice(0, limit);
          const plain = (value, limit = 180) => short(String(value || '').split('\n')[0]
            .replace(/[\\`*_\[\]<>]/g, '\\$&'), limit);
          let title, description, url, color;
          if (env.GITHUB_EVENT_NAME === 'push') {
            const commits = event.commits || [];
            title = repo + ' / ' + branch + ': ' + commits.length + ' commit';
            if (event.deleted) title = repo + ' / ' + branch + ': branch eliminato';
            description = 'Push di **' + plain(actor) + '**' + (event.forced ? ' (force push)' : '') + '\n\n'
              + commits.slice(0, 10).map(commit =>
                '[`' + short(commit.id, 7) + '`](' + commit.url + ') '
                + plain(commit.message, 120) + ' - ' + plain(commit.author?.name, 48)).join('\n');
            if (commits.length > 10) description += '\nAltri ' + (commits.length - 10) + ' commit nel confronto.';
            url = event.compare || event.repository.html_url;
            color = 3447003;
          } else if (env.GITHUB_EVENT_NAME === 'pull_request_target') {
            const pr = event.pull_request;
            const state = pr.merged ? 'unita' : ({
              opened: 'aperta', reopened: 'riaperta', synchronize: 'aggiornata',
              closed: 'chiusa', ready_for_review: 'pronta per la review'
            })[event.action];
            title = repo + ' / ' + branch + ': PR #' + pr.number + ' ' + state;
            description = plain(pr.title) + '\n\nAutore: **' + plain(pr.user.login)
              + '**\nBranch: `' + plain(pr.head.ref) + ' -> ' + branch
              + '`\nEvento di: **' + plain(actor) + '**';
            url = pr.html_url;
            color = pr.merged ? 10181046 : event.action === 'closed' ? 15158332 : 3066993;
          } else {
            title = repo + ' / ' + branch + ': notifiche attive';
            description = 'Test della configurazione Discord eseguito da **' + plain(actor) + '**.';
            url = event.repository.html_url;
            color = 3447003;
          }

          const payload = JSON.stringify({
            allowed_mentions: { parse: [] },
            embeds: [{
              title: short(title, 256), description: short(description, 4096), url, color,
              footer: { text: 'GitHub / ' + branch }, timestamp: new Date().toISOString()
            }]
          });
          const endpoint = new URL(webhook);
          endpoint.searchParams.set('wait', 'true');
          let sent = false;
          for (let attempt = 0; attempt < 3; attempt++) {
            let response;
            try {
              response = await fetch(endpoint, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: payload, signal: AbortSignal.timeout(15000)
              });
            } catch {
              throw new Error('Discord request failed or timed out');
            }
            if (response.ok) { sent = true; break; }
            if ((response.status !== 429 && response.status < 500) || attempt === 2)
              throw new Error('Discord notification failed (HTTP ' + response.status + ')');
            const delay = Math.min(30000, Math.max(1000, Number(response.headers.get('retry-after') || 2) * 1000));
            await new Promise(resolve => setTimeout(resolve, delay));
          }
          if (!sent) throw new Error('Discord notification was not delivered');
          console.log('Discord notification delivered: ' + repo + ' / ' + branch);
          NODE
